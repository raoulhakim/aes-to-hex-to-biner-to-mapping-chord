      <stop offset="0%" stop-color="#7e6ee2" />
      <stop offset="100%" stop-color="#3498db" />
    </linearGradient>
  </defs>
  <!-- Lingkaran dasar -->
  <circle cx="32" cy="32" r="30" fill="#18182a" stroke="url(#gradient)" stroke-width="3" />
