<svg xmlns="http://www.w3.org/2000/svg" width="240" height="80" viewBox="0 0 240 80">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db" />
      <stop offset="100%" stop-color="#8e44ad" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sound Wave Background -->
  <path d="M10,40 Q30,20 50,40 T90,40 T130,40 T170,40 T210,40 T250,40" 
        fill="none" stroke="url(#gradient)" stroke-width="2" opacity="0.6" />
  <path d="M10,50 Q30,30 50,50 T90,50 T130,50 T170,50 T210,50 T250,50" 
        fill="none" stroke="url(#gradient)" stroke-width="2" opacity="0.6" />
  <path d="M10,60 Q30,40 50,60 T90,60 T130,60 T170,60 T210,60 T250,60" 
        fill="none" stroke="url(#gradient)" stroke-width="2" opacity="0.6" />
  
  <!-- Music Note -->
  <g transform="translate(40, 35) scale(0.8)" filter="url(#shadow)">
    <path d="M30,10 L30,40 C30,52 15,55 10,48 C5,40 15,30 25,35 L25,5 L50,0 L50,30 C50,42 35,45 30,38 C25,30 35,20 45,25 L45,10 Z" 
          fill="url(#gradient)" />
  </g>
  
  <!-- Lock/Key Symbol -->
  <g transform="translate(110, 30)" filter="url(#shadow)">
    <rect x="5" y="18" width="30" height="22" rx="5" fill="url(#gradient)" />
    <path d="M10,18 L10,10 C10,0 30,0 30,10 L30,18" 
          fill="none" stroke="url(#gradient)" stroke-width="5" stroke-linecap="round" />
    <circle cx="20" cy="28" r="5" fill="#ffffff" />
    <path d="M20,28 L20,35" stroke="#ffffff" stroke-width="2" />
  </g>
  
  <!-- Binary Data -->
  <g transform="translate(160, 36)" filter="url(#shadow)">
    <text font-family="monospace" font-size="10" fill="#ffffff">
      <tspan x="0" y="0">1001</tspan>
      <tspan x="0" y="12">0110</tspan>
      <tspan x="0" y="24">1010</tspan>
    </text>
  </g>
</svg> 