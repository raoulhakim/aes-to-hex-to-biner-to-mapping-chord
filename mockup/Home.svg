<svg width="1440" height="1024" viewBox="0 0 1440 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="0" y="0" width="1440" height="64" fill="#f8f9fa"/>
  <text x="160" y="44" font-family="Inter, Arial" font-size="14" fill="#0F172A">Beranda  Enkripsi  Dekripsi  Tentang</text>

  <!-- Hero -->
  <g transform="translate(160,120)">
    <text x="0" y="0" font-family="Inter, Arial" font-weight="700" font-size="36" fill="#0F172A">
      Noiseless Steganografi Audio dengan AES
    </text>
    <text x="0" y="40" font-family="Inter, Arial" font-size="16" fill="#475569">
      Sembunyikan pesan rahasia dalam file audio yang digenerate menggunakan enkripsi AES...
    </text>
    <g transform="translate(0,72)">
      <rect width="160" height="44" rx="8" fill="#0d6efd"/><text x="20" y="28" font-family="Inter" font-size="14" fill="#fff">Enkripsi</text>
    </g>
    <g transform="translate(176,72)">
      <rect width="160" height="44" rx="8" fill="#ffffff" stroke="#ced4da"/><text x="20" y="28" font-family="Inter" font-size="14" fill="#0F172A">Dekripsi</text>
    </g>
  </g>

  <!-- Info Cards -->
  <g transform="translate(160,240)">
    <g transform="translate(0,120)">
      <rect width="1120" height="120" rx="12" fill="#ffffff" stroke="#E2E8F0"/>
      <g transform="translate(24,24)">
        <text x="0" y="16" font-family="Inter" font-size="12" fill="#64748B">KEAMANAN</text>
        <text x="0" y="44" font-family="Inter" font-size="24" fill="#0F172A">AES-128</text>
        <text x="0" y="72" font-family="Inter" font-size="14" fill="#64748B">Enkripsi pesan</text>
      </g>
      <g transform="translate(560,24)">
        <text x="0" y="16" font-family="Inter" font-size="12" fill="#64748B">HASH</text>
        <text x="0" y="44" font-family="Inter" font-size="24" fill="#0F172A">MD5</text>
        <text x="0" y="72" font-family="Inter" font-size="14" fill="#64748B">Pengamanan password</text>
      </g>
    </g>
  </g>

  <!-- Process Cards -->
  <g transform="translate(160,520)">
    <g>
      <rect width="540" height="280" rx="12" fill="#ffffff" stroke="#E2E8F0"/>
      <text x="16" y="40" font-family="Inter" font-size="18" fill="#0F172A">Enkripsi Pesan</text>
      <text x="16" y="68" font-family="Inter" font-size="12" fill="#64748B">Enkripsi pesan teks ...</text>
      <text x="16" y="100" font-family="Inter" font-size="12" fill="#64748B">1. Masukkan pesan teks</text>
      <text x="16" y="120" font-family="Inter" font-size="12" fill="#64748B">2. Masukkan kunci 16 karakter</text>
      <g transform="translate(16,200)">
        <rect width="160" height="36" rx="6" fill="#0d6efd"/><text x="16" y="24" font-family="Inter" font-size="12" fill="#fff">Enkripsi Sekarang</text>
      </g>
    </g>
    <g transform="translate(580,0)">
      <rect width="540" height="280" rx="12" fill="#ffffff" stroke="#E2E8F0"/>
      <text x="16" y="40" font-family="Inter" font-size="18" fill="#0F172A">Dekripsi Audio</text>
      <text x="16" y="68" font-family="Inter" font-size="12" fill="#64748B">Ekstrak dan dekripsi ...</text>
      <text x="16" y="100" font-family="Inter" font-size="12" fill="#64748B">1. Unggah file audio</text>
      <text x="16" y="120" font-family="Inter" font-size="12" fill="#64748B">2. Masukkan kunci 16 karakter</text>
      <g transform="translate(16,200)">
        <rect width="160" height="36" rx="6" fill="#ffffff" stroke="#ced4da"/><text x="16" y="24" font-family="Inter" font-size="12" fill="#0F172A">Dekripsi Sekarang</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <text x="160" y="980" font-family="Inter" font-size="12" fill="#64748B">Steganografi Audio AES © 2025</text>
</svg>