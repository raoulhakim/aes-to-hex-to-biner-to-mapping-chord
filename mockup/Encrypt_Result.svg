<svg width="1440" height="1024" viewBox="0 0 1440 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="0" y="0" width="1440" height="64" fill="#f8f9fa"/>
  <text x="160" y="44" font-family="Inter" font-size="14" fill="#0F172A">Hasil Enkripsi</text>

  <g transform="translate(160,96)">
    <rect width="1120" height="760" rx="12" fill="#ffffff" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="1120" height="56" rx="12" fill="#f1f5f9"/>
    <text x="16" y="36" font-family="Inter" font-size="14" font-weight="600" fill="#0F172A">Hasil Enkripsi</text>

    <g transform="translate(24,72)">
      <rect width="1072" height="80" rx="8" fill="#d1e7dd" stroke="#badbcc"/>
      <text x="16" y="48" font-family="Inter" font-weight="600" font-size="14" fill="#0F172A">Berhasil! Pesan terenkripsi dan disimpan ke file audio.</text>
    </g>

    <!-- Detail Enkripsi (left) -->
    <g transform="translate(24,168)">
      <rect width="520" height="420" rx="12" fill="#ffffff" stroke="#E2E8F0"/>
      <rect x="0" y="0" width="520" height="48" rx="12" fill="#f1f5f9"/>
      <text x="16" y="30" font-family="Inter" font-size="14" font-weight="600" fill="#0F172A">Detail Enkripsi</text>

      <text x="16" y="80" font-family="Inter" font-size="12" fill="#0F172A">Pesan (plaintext):</text>
      <rect x="16" y="92" width="488" height="64" rx="8" fill="#f8f9fa" stroke="#E2E8F0"/>

      <!-- Password AES -->
      <text x="16" y="178" font-family="Inter" font-size="12" fill="#0F172A">Password AES:</text>
      <rect x="16" y="190" width="360" height="40" rx="6" fill="#ffffff" stroke="#CBD5E1"/>
      <g transform="translate(384,190)">
        <rect width="120" height="40" rx="6" fill="#ffc107"/>
        <text x="14" y="26" font-family="Inter" font-size="12" fill="#0F172A">Salin</text>
      </g>
      <text x="16" y="242" font-family="Inter" font-size="12" fill="#dc3545">PENTING! Simpan password AES ini.</text>

      <!-- Chord positions -->
      <text x="16" y="276" font-family="Inter" font-size="12" fill="#0F172A">Password Urutan Chord:</text>
      <rect x="16" y="288" width="360" height="40" rx="6" fill="#ffffff" stroke="#CBD5E1"/>
      <g transform="translate(384,288)">
        <rect width="120" height="40" rx="6" fill="#ffc107"/>
        <text x="14" y="26" font-family="Inter" font-size="12" fill="#0F172A">Salin</text>
      </g>
      <text x="16" y="340" font-family="Inter" font-size="12" fill="#dc3545">PENTING! Simpan password urutan chord ini.</text>
    </g>

    <!-- File Audio (right) -->
    <g transform="translate(576,168)">
      <rect width="520" height="420" rx="12" fill="#ffffff" stroke="#E2E8F0"/>
      <rect x="0" y="0" width="520" height="48" rx="12" fill="#f1f5f9"/>
      <text x="16" y="30" font-family="Inter" font-size="14" font-weight="600" fill="#0F172A">File Audio</text>

      <text x="16" y="80" font-family="Inter" font-size="12" fill="#0F172A">Pesan disembunyikan dalam file berikut:</text>
      <rect x="16" y="100" width="488" height="54" rx="8" fill="#ffffff" stroke="#E2E8F0"/>
      <g transform="translate(16,170)">
        <rect width="160" height="40" rx="6" fill="#0d6efd"/>
        <text x="16" y="26" font-family="Inter" font-size="12" fill="#ffffff">Unduh File Audio</text>
      </g>
    </g>

    <!-- Bottom actions -->
    <g transform="translate(24,616)">
      <rect width="200" height="36" rx="6" fill="#ffffff" stroke="#ced4da"/><text x="16" y="24" font-family="Inter" font-size="12" fill="#0F172A">Enkripsi Pesan Lain</text>
      <g transform="translate(220,0)">
        <rect width="200" height="36" rx="6" fill="#ffffff" stroke="#0d6efd"/><text x="16" y="24" font-family="Inter" font-size="12" fill="#0d6efd">Kembali ke Beranda</text>
      </g>
    </g>
  </g>
</svg>