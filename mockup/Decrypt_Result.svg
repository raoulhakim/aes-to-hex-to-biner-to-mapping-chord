<svg width="1440" height="1024" viewBox="0 0 1440 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="1024" fill="#ffffff"/>
  <rect x="0" y="0" width="1440" height="64" fill="#f8f9fa"/>
  <text x="160" y="44" font-family="Inter" font-size="14" fill="#0F172A">Hasil Dekripsi</text>

  <g transform="translate(160,96)">
    <rect width="1120" height="760" rx="12" fill="#ffffff" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="1120" height="56" rx="12" fill="#f1f5f9"/>
    <text x="16" y="36" font-family="Inter" font-size="14" font-weight="600" fill="#0F172A">Hasil Dekripsi</text>

    <g transform="translate(24,72)">
      <rect width="1072" height="80" rx="8" fill="#d1e7dd" stroke="#badbcc"/>
      <text x="16" y="48" font-family="Inter" font-weight="600" font-size="14" fill="#0F172A">Berhasil! Pesan telah didekripsi.</text>
    </g>

    <g transform="translate(24,168)">
      <!-- Left card -->
      <rect width="520" height="360" rx="12" fill="#ffffff" stroke="#E2E8F0"/>
      <rect x="0" y="0" width="520" height="48" rx="12" fill="#f1f5f9"/>
