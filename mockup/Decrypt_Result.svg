      <text x="16" y="80" font-family="Inter" font-size="12" fill="#0F172A">Pesan Asli:</text>
      <rect x="16" y="92" width="488" height="64" rx="8" fill="#f8f9fa" stroke="#E2E8F0"/>
      <text x="16" y="170" font-family="Inter" font-size="12" fill="#64748B">Jumlah karakter: 123</text>

      <text x="16" y="210" font-family="Inter" font-size="12" fill="#0F172A">Waktu Dekripsi:</text>
      <rect x="16" y="222" width="260" height="40" rx="8" fill="#f8f9fa" stroke="#E2E8F0"/>
    </g>

    <g transform="translate(576,168)">
