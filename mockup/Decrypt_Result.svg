    <g transform="translate(24,560)">
      <rect width="160" height="36" rx="6" fill="#0d6efd"/><text x="16" y="24" font-family="Inter" font-size="12" fill="#fff">Dekripsi File Lain</text>
      <g transform="translate(180,0)">
        <rect width="180" height="36" rx="6" fill="#ffffff" stroke="#ced4da"/><text x="16" y="24" font-family="Inter" font-size="12" fill="#0F172A">Kembali ke Beranda</text>
