      <rect width="520" height="360" rx="12" fill="#ffffff" stroke="#E2E8F0"/>
      <rect x="0" y="0" width="520" height="48" rx="12" fill="#f1f5f9"/>
      <text x="16" y="30" font-family="Inter" font-size="14" font-weight="600" fill="#0F172A">Informasi Kunci</text>

